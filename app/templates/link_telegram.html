{% extends "base.html" %}
{% block content %}
<h1>Привязка Telegram</h1>
<section class="card">
  <p>Нажмите кнопку и подтвердите вход в Telegram.</p>
  <script async src="https://telegram.org/js/telegram-widget.js?22"
          data-telegram-login="{{ telegram_bot_username }}"
          data-size="large" data-radius="8"
          data-auth-url="{{ base_url }}/auth/telegram" data-request-access="write"></script>
  <p><a href="/cabinet">Вернуться в кабинет</a></p>
</section>
{% endblock %}
